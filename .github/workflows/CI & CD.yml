name: Flask CI/CD Pipeline

on:
  push:
    branches:
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:

  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Build Docker image
        run: docker build -t flaskapp:latest .

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Tag image
        run: docker tag flaskapp:latest ${{ secrets.DOCKER_USERNAME }}/flaskapp:latest

      - name: Push image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/flaskapp:latest


  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Run container temporarily (no SSH)
        run: |
          docker run -d -p 5000:5000 --name flaskapp ${{ secrets.DOCKER_USERNAME }}/flaskapp:latest

      - name: Show running containers
        run: docker ps

      - name: Cleanup container
        run: |
          docker stop flaskapp
          docker rm flaskapp
