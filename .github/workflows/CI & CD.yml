name: Flask CI/CD Pipeline

on:
  push:
    branches:
      - main

# Force Node.js 24 for GitHub Actions JS actions
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:

  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build Docker image
        run: |
          docker build -t flaskapp:latest .

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Tag Docker image
        run: |
          docker tag flaskapp:latest ${{ secrets.DOCKER_USERNAME }}/flaskapp:latest

      - name: Push Docker image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/flaskapp:latest

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Deploy directly
        run: |
          docker pull ${{ secrets.DOCKER_USERNAME }}/flaskapp:latest
          docker rm -f flaskapp || true
          docker run -d -p 5000:5000 --name flaskapp --restart unless-stopped ${{ secrets.DOCKER_USERNAME }}/flaskapp:latest
