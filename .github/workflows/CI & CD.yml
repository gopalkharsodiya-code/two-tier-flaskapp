name: Flask CI/CD Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag:
        description: "Enter image tag (example: v1.0)"
        required: false

env:
  IMAGE_NAME: flaskapp

jobs:

  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set image tag
        run: |
          if [ -z "${{ github.event.inputs.tag }}" ]; then
            echo "TAG=${GITHUB_SHA::7}" >> $GITHUB_ENV
          else
            echo "TAG=${{ github.event.inputs.tag }}" >> $GITHUB_ENV
          fi

      - name: Build Docker image
        run: docker build -t $IMAGE_NAME:$TAG .

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Tag image (latest + version)
        run: |
          docker tag $IMAGE_NAME:$TAG ${{ secrets.DOCKER_USERNAME }}/$IMAGE_NAME:$TAG
          docker tag $IMAGE_NAME:$TAG ${{ secrets.DOCKER_USERNAME }}/$IMAGE_NAME:latest

      - name: Push image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/$IMAGE_NAME:$TAG
          docker push ${{ secrets.DOCKER_USERNAME }}/$IMAGE_NAME:latest

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Pull image
        run: docker pull ${{ secrets.DOCKER_USERNAME }}/flaskapp:${{ env.TAG }}

      - name: Stop & remove old container
        run: |
          docker stop flaskapp || true
          docker rm flaskapp || true

      - name: Run new container
        run: |
          docker run -d -p 5000:5000 --name flaskapp \
          ${{ secrets.DOCKER_USERNAME }}/flaskapp:${{ env.TAG }}

      - name: Verify container
        run: docker ps
