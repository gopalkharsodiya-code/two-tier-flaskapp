name: Flask CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop

  workflow_dispatch:
    inputs:
      tag:
        description: "Enter image tag (optional)"
        required: false
         environment:
      description: "Select deployment environment"
      required: true
      default: develop
      type: choice
      options:
        - develop
        - main

env:
  IMAGE_NAME: flaskapp

jobs:

  build:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.set_tag.outputs.TAG }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Print branch (debug)
        run: |
          echo "Branch = ${{ github.ref }}"
          echo "Branch name = ${{ github.ref_name }}"

      - name: Set image tag
        id: set_tag
        run: |
          if [ -z "${{ github.event.inputs.tag }}" ]; then
            TAG=${GITHUB_SHA::7}
          else
            TAG=${{ github.event.inputs.tag }}
          fi
          echo "TAG=$TAG" >> $GITHUB_ENV
          echo "TAG=$TAG" >> $GITHUB_OUTPUT

      - name: Build Docker image
        run: docker build -t $IMAGE_NAME:$TAG .

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Tag & Push Docker image
        run: |
          docker tag $IMAGE_NAME:$TAG ${{ secrets.DOCKER_USERNAME }}/$IMAGE_NAME:$TAG
          docker tag $IMAGE_NAME:$TAG ${{ secrets.DOCKER_USERNAME }}/$IMAGE_NAME:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/$IMAGE_NAME:$TAG
          docker push ${{ secrets.DOCKER_USERNAME }}/$IMAGE_NAME:latest


  deploy-dev:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref_name == 'develop'

    steps:
      - name: Deploy to DEV server
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.DEV_SERVER_IP }}
          username: ${{ secrets.DEV_SERVER_USER }}
          key: ${{ secrets.DEV_SSH_PRIVATE_KEY }}
          port: 2222
          script: |
            cd /home/docker-ce/develop
            docker compose pull
            docker compose down
            docker compose up -d
            docker system prune -af
            echo "✅ DEV Deployment successful"


  deploy-prod:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref_name == 'main'

    steps:
      - name: Deploy to PROD server
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 2222
          script: |
            cd /home/docker-ce/flaskapp
            docker compose pull
            docker compose down
            docker compose up -d
            docker system prune -af
            echo "✅ Production Deployment successful"
