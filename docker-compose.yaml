version: "3.7"

services:

  mysql:
    image: mysql:latest
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: admin
      MYSQL_DATABASE: mydb
    restart: always    
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - bridge

  backend:
    build: .
    image: two-tier-backend  
    container_name: two-tier
    ports:
      - "5000:5000"
    environment:
      MYSQL_HOST: mysql
      MYSQL_USER: root
      MYSQL_PASSWORD: admin
      MYSQL_DB: mydb
    restart: always    
    depends_on:
      - mysql
    networks:
      - bridge

volumes:
  mysql-data:

networks:
  bridge:
